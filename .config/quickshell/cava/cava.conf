# Headless cava config for the bar's now-playing visualizer. Not meant to
# be run interactively -- output is raw ASCII levels parsed by MediaState.qml.
[general]
bars = 5
autosens = 1
sensitivity = 100
framerate = 60

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 44
