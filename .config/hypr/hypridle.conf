general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session; sleep 1
    # 2026-09-03: eDP-1 disable/reload is load-bearing when only the internal panel
    # is active (no DP-2) - without it, resume can hard-freeze until DP-2 gets
    # plugged in, confirmed by testing. It was NOT the cause of the suspend-only
    # "first password attempt always fails" bug (that's a known unresolved upstream
    # hyprlock issue, hyprwm/hyprlock#499 - a stray/swallowed keyboard event when
    # hyprlock recreates its lock surface after a real suspend) - the monitor toggle
    # itself also forces a lock-surface recreation via its own reload, so #499 fires
    # here too. Mitigation: after the toggle+reload settle, send one harmless
    # synthetic keypress before a human would realistically start typing - the same
    # trick users on that issue confirm works manually (tap a throwaway key before
    # entering the real password); it absorbs the stray event so the real password
    # isn't the one that eats it.
    # 2026-09-08: switched disable/reload to a dpms off/on toggle, since eDP-1
    # was coming back corrupted (garbled colors/pixels) after resume. Root cause
    # turned out to be that BOTH `hyprctl keyword monitor ...` and the classic
    # `hyprctl dispatch dpms off` string syntax are silently broken on this
    # Hyprland build - it now uses a Lua-native dispatch API and the old
    # string-based CLI forms either no-op ("keyword can't work with non-legacy
    # parsers") or throw a Lua syntax error. So the disable/reload workaround
    # from 2026-09-03 had actually stopped running at all after the 09-07
    # hyprland/hypridle upgrade, leaving the original un-mitigated resume bug
    # to corrupt the panel. Working syntax confirmed via `hyprctl eval`:
    #   hyprctl eval 'hl.dsp.dpms("off")' / hl.dsp.dpms("on")
    # If the original hard-freeze-without-DP-2 bug comes back, the disable/
    # reload equivalent would need the same hl.dsp.* form, not `keyword`.
    after_sleep_cmd = sleep 1 && hyprctl eval 'hl.dsp.dpms("off")' && sleep 1 && hyprctl eval 'hl.dsp.dpms("on")'
}

listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    # 2026-09-08: `hyprctl dispatch dpms off/on` silently errors on this Hyprland
    # build (Lua-native dispatch API); switched to the working hl.dsp.dpms() form.
    on-timeout = hyprctl eval 'hl.dsp.dpms("off")'
    on-resume = hyprctl eval 'hl.dsp.dpms("on")'
}

listener {
    timeout = 1800
    on-timeout = grep -q 0 /sys/class/power_supply/AC*/online && systemctl suspend
}
