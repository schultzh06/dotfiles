general {
    hide_cursor = false
}

background {
    monitor =
    path = /home/schultzh/Pictures/wp3.png
    blur_passes = 1
    blur_size = 4
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_center = true
    outer_color = rgb(f5e0dc)
    inner_color = rgb(313244)
    font_color = rgb(cdd6f4)
    fail_color = rgb(f38ba8)
    check_color = rgb(f9e2af)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(cdd6f4)
    font_size = 64
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %B %d'
    color = rgb(a6adc8)
    font_size = 20
    position = 0, 40
    halign = center
    valign = center
}

$power_font = Symbols Nerd Font
$fg = rgba(cdd6f4ff)

label {
    monitor =
    text = 󰐥
    color = $fg
    font_size = 28
    font_family = $power_font
    position = -120, 60
    halign = center
    valign = bottom
    onclick = systemctl poweroff
}

label {
    monitor =
    text = 󰜉
    color = $fg
    font_size = 28
    font_family = $power_font
    position = -40, 60
    halign = center
    valign = bottom
    onclick = systemctl reboot
}

label {
    monitor =
    text = 󰤄
    color = $fg
    font_size = 28
    font_family = $power_font
    position = 40, 60
    halign = center
    valign = bottom
    onclick = systemctl suspend
}

label {
    monitor =
    text = 󰗽
    color = $fg
    font_size = 28
    font_family = $power_font
    position = 120, 60
    halign = center
    valign = bottom
    onclick = uwsm stop
}

